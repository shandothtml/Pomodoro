<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>

    <link rel="icon" href="icon/pomodoro.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pomodoro</h1>

        <div class="timer-box">

            <div class="modes">

                <button class="mode-btn active" data-mode="pomodoro">
                    Pomodoro
                </button>

                <button class="mode-btn" data-mode="short">
                    Short Break
                </button>

                <button class="mode-btn" data-mode="long">
                    Long Break
                </button>

            </div>

            <div id="timer">25:00</div>

            <div class="controls">

                <button class="control-btn" id="startPause">
                    Start
                </button>

                <button class="control-btn" id="reset">
                    Reset
                </button>

            </div>

            <p class="session" id="sessionText">
                Pomodoro
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
